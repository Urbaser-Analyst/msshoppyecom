<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS-Shoppy</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">

<!-- Login screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <span class="login-mark">Admin</span>
    <p class="login-sub">Sign in to manage products and orders.</p>
    <div class="form-error" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required autofocus>
      </div>
      <button type="submit" class="checkout-btn" id="loginBtn">Sign in</button>
    </form>
    <a class="back-link" href="index.html">&larr; Back to store</a>
  </div>
</div>

<!-- Admin dashboard -->
<div class="admin-wrap" id="adminWrap" style="display:none;">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <span class="brand-mark">Admin panel</span>
      <div class="admin-header-actions">
        <a href="index.html" target="_blank" class="ghost-btn">View store</a>
        <button class="ghost-btn" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <nav class="admin-tabs container">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </nav>

  <main class="container admin-main">

    <!-- Products tab -->
    <section id="tab-products" class="tab-panel active">
      <div class="panel-head">
        <h2>Products</h2>
        <button class="primary-btn" id="newProductBtn">+ Add product</button>
      </div>
      <div id="productsTableWrap">
        <div class="loading-state">Loading products…</div>
      </div>
    </section>

    <!-- Orders tab -->
    <section id="tab-orders" class="tab-panel">
      <div class="panel-head">
        <h2>Orders</h2>
        <div class="stats-row" id="orderStats"></div>
      </div>
      <div id="ordersTableWrap">
        <div class="loading-state">Loading orders…</div>
      </div>
    </section>

  </main>
</div>

<!-- Product editor modal -->
<div class="modal" id="productModal">
  <div class="modal-card">
    <h2 id="productModalTitle">Add product</h2>
    <div class="form-error" id="productError"></div>
    <form id="productForm">
      <input type="hidden" id="prodId">
      <div class="field">
        <label for="prodName">Product name</label>
        <input type="text" id="prodName" required>
      </div>
      <div class="field">
        <label for="prodDescription">Description</label>
        <textarea id="prodDescription" rows="2"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="prodPrice">Price (₹)</label>
          <input type="number" id="prodPrice" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label for="prodStock">Stock quantity</label>
          <input type="number" id="prodStock" min="0" step="1" value="0" required>
        </div>
      </div>
      <div class="field">
        <label for="prodCategory">Category</label>
        <input type="text" id="prodCategory" placeholder="e.g. Snacks">
      </div>
      <div class="field">
        <label for="prodImage">Product image</label>
        <input type="file" id="prodImage" accept="image/*">
        <div id="imagePreviewWrap"></div>
      </div>
      <div class="field checkbox-field">
        <label><input type="checkbox" id="prodActive" checked> Visible in store</label>
      </div>
      <button type="submit" class="checkout-btn" id="saveProductBtn">Save product</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
